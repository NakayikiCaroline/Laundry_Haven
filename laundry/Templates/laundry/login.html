```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Login | Laundry Haven</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: #f0edfa;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-card {
            width: 100%;
            max-width: 420px;
            background: white;
            padding: 32px;
            border-radius: 16px;
            box-shadow: 0 8px 30px rgba(40, 20, 70, .12);
        }
        .brand {
            color: #6541a5;
            font-weight: 800;
        }
        .btn-login {
            background: #6541a5;
            color: white;
        }
        .btn-login:hover {
            background: #4f3185;
            color: white;
        }
    </style>
</head>
<body>
    <div class="login-card">
        <h2 class="brand text-center">LAUNDRY HAVEN</h2>
        <p class="text-center text-muted mb-4">Management System</p>

        <h5 class="text-center mb-4">Sign in to your account</h5>

        {% if form.errors %}
            <div class="alert alert-danger">
                Invalid username or password. Please try again.
            </div>
        {% endif %}

        {% if next %}
            <p class="text-muted small">Please sign in to continue.</p>
        {% endif %}

        <form method="post">
            {% csrf_token %}

            <div class="mb-3">
                <label for="id_username" class="form-label">Username</label>
                <input type="text" name="username" id="id_username"
                       class="form-control" required autofocus
                       autocomplete="username">
            </div>

            <div class="mb-3">
                <label for="id_password" class="form-label">Password</label>
                <input type="password" name="password" id="id_password"
                       class="form-control" required
                       autocomplete="current-password">
            </div>

            <input type="hidden" name="next" value="{{ next }}">

            <button type="submit" class="btn btn-login w-100">
                Sign In
            </button>
        </form>

        <p class="text-center text-muted small mt-4 mb-0">
            Authorized users only.
        </p>
    </div>
</body>
</html>
```
